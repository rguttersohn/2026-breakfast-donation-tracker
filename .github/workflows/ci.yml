name: Deploy Production

on:
  push:
    branches:
      - feature/add-donor-list

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      
      - name: Generate static site
        run: npx nuxi generate
        env: 
            NUXT_FETCH_INTERVAL: ${{ vars.NUXT_FETCH_INTERVAL }}

      - name: Build
        run: npm run build
        env:
          NUXT_CDN_URL: ${{ vars.NUXT_CDN_URL }}


      - name: Verify build output
        run: |
          test -d .output && test -n "$(ls -A .output)" || (echo "ERROR: .output directory is missing or empty" && exit 1)
      
       # --- Push public assets to S3 ---
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.NUXT_S3_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.NUXT_S3_PRIVATE_KEY }}
          aws-region: us-east-1

      - name: Sync public assets to S3
        env: 
            s3_bucket: ${{ secrets.NUXT_S3_BUCKET }}
        run: |
          aws s3 sync .output/public s3://$s3_bucket \
            --exclude "*" --include "_nuxt/*" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync .output/public s3://$s3_bucket \
            --exclude "_nuxt/*" \
            --cache-control "public, max-age=0, must-revalidate" --delete
      
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"